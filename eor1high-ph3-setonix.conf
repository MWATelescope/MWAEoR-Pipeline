// sbatch -o /scratch/mwaeor/dev/claude-eor/logs/nf_head.%j.log scripts/eor1high_zenith20260905_setonix.sh
// which runs, once per band (--lssa_bias_mode 11 lower, 12 middle, 10 upper):
// nextflow run main.nf -profile setonix -c eor1high-ph3-setonix.conf -entry extRaw --obsids_suffix=-eor1high-zenith20260905 --lssa_bias_mode=10
//
// EoR1 high band, Phase III, on Setonix. Same as eor1high-ph3.conf except:
// - input is the measurement set Birli already wrote (8 s / 80 kHz, --no-rfi --flag-edge-chans 0
//   --no-flag-dc), linked as nfdata/<obsid>/prep/birli_<obsid>_8s_80kHz_norfi.ms, with its metafits
//   linked as nfdata/<obsid>/raw/<obsid>.metafits (prep_ms): ASVO does not serve these obs and
//   the raw files are not on Setonix.
// - no RFI flags: no AOFlagger, and SSINS is measured but not applied (ssins_apply = false), so
//   the product names carry no "ssins". No coarse channel edge flags (oversampled data).
// - hyperdrive with the beam interpolated in frequency (mwa_hyperdrive#118, def4c31; every
//   earlier build leaves a 781 ns comb in the EoR window) and the standard FEE beam file.
// - sky model with Fornax A v2; dical_name 30l_src8k_300it_fnxav2. No --freq-average in di-cal:
//   the input is already 80 kHz.
// - CHIPS image pinned; grid, combine and lssa run in the work directory, not the ram disk.
// - no metadata gates (the list is hand picked), no videos, no archiving.
// - hyperdrive comes from one container, params.hyperdrive_sif (a docker:// uri or a .sif
//   path; --hyperdrive_sif on the command line overrides it), instead of the hyperdrive/0.6.1
//   module of the profile. It must be a ROCm (HIP, gfx90a) build for the MI250X gpus.
//   The python tools come from the mwa-demo image built on top of it (params.mwa_demo_sif).
//   The launch script pulls both into claude-eor/containers.
// - di-cal asks for one gpu on the gpu queue instead of the whole gpu-highmem node of label
//   gpu_nvme: the inputs are 2.5 GB.
workDir = '/scratch/mwaeor/dev/claude-eor/nfwork'

singularity {
    cacheDir = '/scratch/mwaeor/dev/claude-eor/singularity'
}

params {
    outdir = '/scratch/mwaeor/dev/claude-eor/nfdata'
    resultsdir = '/scratch/mwaeor/dev/claude-eor/nfresults'

    filter_sweet_pointings = null
    filter_ew_pointings = null
    filter_bad_tile_frac = null
    filter_min_good_tiles = null
    filter_dead_dipole_frac = null
    filter_quality = null
    filter_config = null
    filter_eorfield = null
    filter_eorband = null
    filter_ra = null
    filter_dec = null
    filter_ionoqa = null
    filter_sun_elevation = null

    noppds = true // ppds are not a thing in ph3

    // //// //
    // PREP //
    // //// //
    prep_ms = true
    pullPrep = false
    prep_time_res_s = 8
    prep_freq_res_khz = 80
    van_vleck = false
    // no edge flagging: the data are oversampled
    prep_edge_width = null
    birli_args = '--flag-edge-chans 0 --no-flag-dc'
    prep_rfi = 0

    flag_occupancy_threshold = 0.5
    rfi_occupancy_threshold = 0.03

    // measure ssins, but do not apply its flags
    ssins_apply = false
    ssins_occupancy_threshold = 0.99
    ssins_narrow_threshold = null
    ssins_dab_threshold = null
    ssins_streak_threshold = 0.99

    // /// //
    // CAL //
    // /// //
    cal_suffix = "_noflag"

    filter_max_rms_convg = 1e-5 // arbitrary

    noPrepFlags = false
    noCalFlags = false
    pullCalSol = false

    // must contain mwa_hyperdrive#118 (main at def4c31 or later) built with --features=hip.
    // docker://mwatelescope/hyperdrive:bmetrics-92d3a5c-rocm6.3.3-ubuntu24.04 is the bmetrics
    // branch at 92d3a5c: main at def4c31 plus 71 commits.
    hyperdrive_sif = '/scratch/mwaeor/dev/claude-eor/containers/hyperdrive_bmetrics-92d3a5c-rocm6.3.3-ubuntu24.04.sif'
    // docker://mwatelescope/mwa-demo:f55fd52-hyperdrive-bmetrics-92d3a5c-rocm6.3.3-ubuntu24.04
    mwa_demo_sif = '/scratch/mwaeor/dev/claude-eor/containers/mwa-demo_f55fd52-hyperdrive-bmetrics-92d3a5c-rocm6.3.3-ubuntu24.04.sif'
    hyperdrive = 'hyperdrive'
    hyperdrive_cpu = 'hyperdrive'

    // high fidelity calibration
    hyp_srclist_args = '--source-dist-cutoff=180 --veto-threshold 0.005'
    dical_name = "30l_src8k_300it_fnxav2"
    dical_args = "-n 8000 --uvw-min 30l --max-iterations 300 --stop-thresh 1e-20"
    sourcelist = '/scratch/mwaeor/dev/claude-eor/srclist_pumav3_EoR0LoBES_EoR1pietro_CenA-GP_2023-11-07_no-shapelets_FnxA-v2-20260905.yaml'
    beam_path = '/software/projects/mwaeor/dev/mwa_full_embedded_element_pattern.h5'

    noeor = false

    // already 8 s / 80 kHz; kept so that the product names match the other ph3 confs
    apply_time_res = 8
    apply_freq_res = 80

    // /// //
    // SUB //
    // /// //
    nosub = true
    noionosub = false

    hyp_peel_args = '--num-passes 5 --num-loops 6 --convergence 0.5'
    sub_nsrcs = 8000
    ionosub_nsrcs = 1000

    filter_max_hyp_ionoqa = null

    // /// //
    // IMG //
    // /// //
    noimg = true

    // ///// //
    // PSPEC //
    // ///// //
    nopsmetrics = false
    nodelayspec = false
    nopowerspec = false
    noplotvisqa = false
    nochips = false
    noplotchips = false
    // 384 channels of 80 kHz from 167.06 MHz: three 192 channel bands starting at channel
    // 0 (bias mode 11), 96 (12) and 192 (10)
    lssa_bias_mode = 10
    chips_sif = 'docker://d3vnull0/chips2024:sha-79450ae'

    filter_max_ps_window_unsub = null
    filter_min_ps_window_unsub = null
    filter_max_ps_ratio_unsub = null
    filter_min_ps_ratio_unsub = null
    filter_max_ps_wedge_ratio_sub = null
    filter_min_ps_wedge_ratio_sub = null
    filter_max_ps_win_ratio_sub = null
    filter_min_ps_win_ratio_sub = null

    novideo = true
    nodemo = true
    archive = false
    bucket_prefix = "mwaeor:high1"
}

process {
    // the containers of the profile are set before this file is read, so set them here
    withLabel: hyperdrive {
        module = 'singularity/4.3.5-nohost'
        container = "${params.hyperdrive_sif}"
        containerOptions = '--rocm'
    }
    withLabel: hyperdrive_cpu {
        module = 'singularity/4.3.5-nohost'
        container = "${params.hyperdrive_sif}"
    }
    withLabel: 'mwa_demo|python|tap|ssins' {
        container = "${params.mwa_demo_sif}"
    }
    withName: hypCalSol {
        queue = 'gpu'
        clusterOptions = { "--nodes=1 --account=${PAWSEY_PROJECT}-gpu --gres=gpu:1" }
    }
    withLabel: chips {
        container = 'docker://d3vnull0/chips2024:sha-79450ae'
    }
    withName: chipsGrid {
        scratch = false
        cpus = 64
        memory = 120.GB
    }
    withName: chipsCombine {
        scratch = false
        queue = 'work'
        cpus = 64
        memory = 120.GB
    }
    withName: chipsLssa {
        scratch = false
        cpus = 64
        memory = 120.GB
    }
}
